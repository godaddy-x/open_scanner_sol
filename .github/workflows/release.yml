name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${ACTIONS_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/godaddy-x/*
          go env -w GONOPROXY=github.com/godaddy-x/*
          go env -w GONOSUMDB=github.com/godaddy-x/*
          go mod download

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build release binaries
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Generate SHA256SUMS
        working-directory: output
        run: |
          sha256sum open-scanner-sol-* > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            output/open-scanner-sol-linux-amd64
            output/open-scanner-sol-linux-arm64
            output/open-scanner-sol-darwin-amd64
            output/open-scanner-sol-darwin-arm64
            output/open-scanner-sol-windows-amd64.exe
            output/SHA256SUMS
